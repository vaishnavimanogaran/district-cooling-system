<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>District Cooling System</h2>
</header>

<nav class="top-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="customers.html">Customers</a>
    <a href="plants.html">Plants</a>
    <a href="vendors.html">Vendors</a>
    <a href="invoices.html">Invoices</a>
    <a href="reports.html">Reports</a>
    <a href="login.html">Logout</a>
</nav>

<div class="container">

    <div class="card">
        <h2>Welcome, Admin 👋</h2>
        <p>Monitor customers, chiller plants, vendors, invoices and reports from one place.</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;">

        <div class="card">
            <h3>Total Customers</h3>
            <h1 id="customerCount">0</h1>
        </div>

        <div class="card">
            <h3>Chiller Plants</h3>
            <h1 id="plantCount">0</h1>
        </div>

        <div class="card">
            <h3>Vendors</h3>
            <h1 id="vendorCount">0</h1>
        </div>

        <div class="card">
            <h3>Invoices</h3>
            <h1 id="invoiceCount">0</h1>
        </div>

    </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
